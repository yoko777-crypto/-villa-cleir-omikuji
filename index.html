<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Villaクレア｜くれんちゅ旅みくじ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color:#333;
  text-align:center;
  background:linear-gradient(180deg,#eef9fb 0%,#fffaf3 100%);
  min-height:100vh;
}

.container{
  max-width:520px;
  margin:auto;
  padding:45px 20px 55px;
}

.villa{
  letter-spacing:5px;
  color:#777;
  font-size:18px;
  margin-bottom:10px;
}

h1{
  font-size:34px;
  margin:0 0 10px;
}

.character{
  width:230px;
  max-width:75%;
  margin:10px auto 15px;
  display:block;
}

.intro{
  font-size:17px;
  line-height:1.8;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:24px;
  padding:25px 20px;
  margin:20px 0;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.character-talk{
  font-size:18px;
  line-height:1.8;
  font-weight:600;
}

button{
  width:100%;
  border:none;
  border-radius:40px;
  padding:18px;
  font-size:20px;
  font-weight:bold;
  color:white;
  background:#df8d4c;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(223,141,76,.25);
}

button:active{
  transform:scale(.98);
}

#result{
  display:none;
}

.result-title{
  color:#df8d4c;
  font-size:29px;
  margin:5px 0 15px;
}

.result-text{
  font-size:18px;
  line-height:1.8;
}

.share{
  background:#fff3f6;
  border-radius:20px;
  padding:18px 12px;
  margin-top:22px;
  line-height:1.7;
}

.hashtag{
  font-size:19px;
  font-weight:bold;
  color:#d75a78;
}

.footer{
  margin-top:35px;
  color:#888;
  line-height:1.8;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="villa">VILLA CLEIR</div>

  <h1>🌺 くれんちゅ旅みくじ 🌺</h1>

  <img
    class="character"
    src="118A65D1-E761-4597-AFBD-36BF2AF19DB1.png"
    alt="くれんちゅ＆くれっしー"
  >

  <div class="intro">
    Villaクレアへようこそ。<br>
    今日の沖縄旅は、どんな一日になるかな？
  </div>

  <div class="card" id="start">
    <div class="character-talk">
      くれんちゅ＆くれっしーが<br>
      あなたの今日の「旅運」を占うよ！<br>
      さっそく引いてみてね♪
    </div>
  </div>

  <button onclick="drawOmikuji()">旅みくじを引く</button>

  <div class="card" id="result">

    <div class="result-title" id="resultTitle"></div>

    <div class="result-text" id="resultText"></div>

    <div class="share">
      📸 今日の旅みくじを<br>
      写真やスクショでシェアしてね！<br><br>

      <span class="hashtag">
        #Villaクレア旅みくじ
      </span><br>

      をつけて投稿してね🌺
    </div>

  </div>

  <div class="footer">
    Villaクレアでの時間が<br>
    素敵な沖縄の思い出になりますように。
  </div>

</div>

<script>

const omikuji = [

{
 title:"🌺 最高の沖縄日和",
 text:"今日は思いきり沖縄を楽しめそう！青い海や古宇利島の景色が、忘れられない旅の思い出になるかも。気になった場所には迷わず行ってみて♪"
},

{
 title:"🌊 海風ラッキー",
 text:"今日の幸運スポットは海の近く。潮風を感じながらのんびり過ごすと、素敵な発見がありそう。お気に入りの海を探してみてね♪"
},

{
 title:"🌅 夕日チャンス",
 text:"今日は夕方に幸運が待っているかも。沖縄の空が染まる時間を、少しだけゆっくり眺めてみて。旅のベストショットが撮れる予感！"
},

{
 title:"🍍 なんくる旅運",
 text:"予定通りじゃなくても大丈夫。寄り道した先に、沖縄らしい小さな幸せが待っているかも。今日はゆったり気分で楽しんで♪"
},

{
 title:"✨ 寄り道ラッキー",
 text:"今日は偶然の出会いが旅を楽しくしてくれそう。気になるカフェや景色を見つけたら、ちょっと寄り道してみてね♪"
},

{
 title:"💛 ほっこり旅運",
 text:"今日は誰かと過ごす時間が幸運を運んでくれそう。たくさん笑って、写真を撮って、沖縄での時間を楽しんでね♪"
},

{
 title:"🌴 のんびり大吉",
 text:"今日は急がないことが一番のラッキー。Villaクレアでのんびりしたり、沖縄の風を感じたり。何もしない時間も旅の思い出になるよ♪"
}

];

function drawOmikuji(){

 const item =
 omikuji[Math.floor(Math.random()*omikuji.length)];

 document.getElementById("resultTitle").innerText =
 item.title;

 document.getElementById("resultText").innerText =
 item.text;

 document.getElementById("result").style.display =
 "block";

 document.getElementById("result").scrollIntoView({
   behavior:"smooth",
   block:"center"
 });

}

</script>

</body>
</html>
