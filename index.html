<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Villaクレア｜くれんちゅ旅みくじ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color:#333;
  text-align:center;
  background:linear-gradient(180deg,#eef9fb 0%,#fffaf4 100%);
  min-height:100vh;
}

.container{
  max-width:650px;
  margin:auto;
  padding:35px 20px 60px;
}

.villa{
  font-size:16px;
  letter-spacing:3px;
  color:#777;
  margin-bottom:8px;
}

h1{
  font-size:34px;
  margin:5px 0 10px;
}

.sub{
  color:#666;
  line-height:1.8;
  margin-bottom:25px;
}

.character{
  font-size:65px;
  margin:20px 0 5px;
}

.speech{
  background:white;
  border-radius:22px;
  padding:18px;
  margin:15px auto 25px;
  max-width:430px;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
  line-height:1.7;
}

button{
  width:100%;
  max-width:420px;
  border:0;
  border-radius:50px;
  padding:18px;
  font-size:19px;
  font-weight:bold;
  background:#d98b55;
  color:white;
  cursor:pointer;
}

.result{
  display:none;
  background:white;
  border-radius:28px;
  padding:30px 22px;
  margin:30px auto 0;
  max-width:480px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.rank{
  display:inline-block;
  padding:7px 25px;
  border:1px solid #d98b55;
  border-radius:30px;
  color:#b56e3d;
  margin-bottom:18px;
}

.icon{
  font-size:55px;
}

.result h2{
  font-size:30px;
  margin:8px 0;
}

.message{
  line-height:1.9;
  font-size:17px;
}

.share{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #eee;
  line-height:1.8;
}

.hashtag{
  font-weight:bold;
  color:#c56f42;
  font-size:18px;
}

.retry{
  margin-top:20px;
  background:white;
  color:#555;
  border:1px solid #ccc;
}

.footer{
  margin-top:45px;
  color:#888;
  font-size:14px;
  line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<div class="villa">VILLA CLEIR</div>

<h1>🌺 くれんちゅ旅みくじ 🌺</h1>

<div class="sub">
Villaクレアへようこそ。<br>
今日の沖縄旅は、どんな一日になるかな？
</div>

<div class="character">🍍🌺　🍍</div>

<div class="speech">
くれんちゅ＆くれっしーが<br>
あなたの今日の<strong>「旅運」</strong>を占うよ！<br>
さっそく引いてみてね♪
</div>

<button onclick="draw()">旅みくじを引く</button>

<div id="result" class="result">

<div id="rank" class="rank"></div>

<div id="icon" class="icon"></div>

<h2 id="title"></h2>

<div id="message" class="message"></div>

<div class="share">
今日の旅みくじを<br>
写真やスクショでシェアしてね！<br><br>

<span class="hashtag">#ヴィラクレア旅みくじ</span>
</div>

<button class="retry" onclick="draw()">
もう一度引く
</button>

</div>

<div class="footer">
Villaクレアでの時間が<br>
素敵な沖縄の思い出になりますように。
</div>

</div>

<script>

const fortunes = [

{
rank:"大吉",
icon:"🌊",
title:"海運",
message:"今日は沖縄の青い海が幸運を運んでくれそう。お気に入りの海景色を一枚、旅の思い出に残してみて。"
},

{
rank:"大吉",
icon:"🌅",
title:"夕日運",
message:"今日のラッキータイムは夕暮れ。空が染まる時間に、少しだけ立ち止まって沖縄の景色を楽しんでみて。"
},

{
rank:"中吉",
icon:"🌺",
title:"出会い運",
message:"今日は思いがけない素敵な出会いがありそう。気になった場所には、ちょっと寄り道してみて。"
},

{
rank:"中吉",
icon:"🍍",
title:"グルメ運",
message:"今日は沖縄グルメが幸運のカギ。気になっていた沖縄の味をひとつ楽しんでみて。"
},

{
rank:"吉",
icon:"🌴",
title:"のんびり運",
message:"今日は予定を詰め込みすぎないのが吉。沖縄時間で、ゆっくり過ごしてみて。"
},

{
rank:"吉",
icon:"📸",
title:"思い出運",
message:"今日何気なく撮った一枚が、大切な旅の思い出になりそう。くれんちゅたちとも一緒に写真を撮ってみてね。"
},

{
rank:"小吉",
icon:"✨",
title:"寄り道運",
message:"予定になかった寄り道に小さな幸せがありそう。気になる道や景色を見つけたら楽しんでみて。"
},

{
rank:"吉",
icon:"💛",
title:"しあわせ運",
message:"今日は小さな幸せを見つけられる日。Villaクレアで過ごす何気ない時間も、旅の思い出にしてね。"
}

];

function draw(){

const f=fortunes[Math.floor(Math.random()*fortunes.length)];

document.getElementById("rank").textContent=f.rank;
document.getElementById("icon").textContent=f.icon;
document.getElementById("title").textContent=f.title;
document.getElementById("message").textContent=f.message;

const result=document.getElementById("result");
result.style.display="block";

result.scrollIntoView({
behavior:"smooth",
block:"center"
});

}

</script>

</body>
</html>
